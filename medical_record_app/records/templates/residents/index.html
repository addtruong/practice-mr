{% extends "base.html" %}

{% block title %}
Residents
{% endblock %}


{% block content %}
    <div class="d-flex align-items-center justify-content-between my-2">
        <h1>Residents</h1>

        <a href="{% url 'records:resident_create' %}" class="btn btn-primary">
            Create resident
        </a>
    </div>

    {% if residents %}
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col" class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for resident in residents %}
                        <tr>
                            <td>
                                <a class="text-decoration-none" href="{% url 'records:resident_detail' resident.id %}">
                                    {{ resident.first_name }}
                                    {{ resident.last_name }}
                                </a>
                            </td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-2">
                                    <a class="btn btn-sm btn-outline-primary" href="{% url 'records:resident_update' resident_id=resident.id %}">
                                        Edit
                                    </a>
                                    <form
                                        method="post"
                                        action="{% url 'records:resident_delete' resident.id %}"
                                        class="d-inline"
                                        onsubmit="return confirm('Do you want to delete this resident?')"
                                    >
                                        {% csrf_token %}
                                        <button
                                            type="submit"
                                            class="btn btn-sm btn-outline-danger"
                                        >
                                            Delete
                                        </button>
                                    </form>
                                </div>

                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <!-- <ul>
            {% for resident in residents %}
                <li>
                    <a href="{% url 'records:resident_detail' resident_id=resident.id %}">
                        {{ resident }}
                    </a>
                    <form action="{% url 'records:resident_delete' resident.id %}" method="post">
                        {% csrf_token %}
                        <button type="submit" onclick="return confirm('Do you want to delete this resident?')">
                            Delete
                        </button>
                    </form>   
                </li>
            {% endfor %}
        </ul> -->
    {% endif %}
{% endblock %}
