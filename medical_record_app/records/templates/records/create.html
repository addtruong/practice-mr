{% extends "base.html" %}

{% block title %}
  Create medical record 
{% endblock %}

{% block content %}
  <div class="mx-auto form-wrapper">

    <h1>New Medical Record</h1>
  
    <form method="post">
      {% csrf_token %}
  
      {{ form.as_p }}
  
      <h2>Diagnoses</h2>
      {{ formset.management_form }}
  
      {% for f in formset %}
        <div>{{ f.as_p }}</div>
      {% endfor %}
  
      <button class="btn btn-primary" type="submit">Create medical record</button>
    </form>
  </div> 
{% endblock %}
