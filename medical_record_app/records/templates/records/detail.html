<h1>{{ medical_record }}</h1>

{{ medical_record }}

<br>
<a href="{% url 'records:update' medical_record_id=medical_record.id %}">
    <button type="button">Edit</button>
</a>
<form
    method="post"
    action="{% url 'records:delete' medical_record.id %}"
>
    {% csrf_token %}
    <button
        type="submit"
        onclick="return confirm('Do you want to delete this medical record?')"
    >
        Delete
    </button>
</form>
<br>
<a href="{% url 'records:index' %}">All medical records</a>
