<h1>Update medical record</h1>
<form method="post">
    {% csrf_token %}

    <label for="resident">Resident:</label>
    <select name="resident" id="resident">
        {% for resident in residents %}
            <option
                value="{{ resident.pk }}"
                {% if resident.pk == medical_record.resident.pk %}selected{% endif %}
            >
                {{ resident }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Update</button>
</form>

<ul>
    <li>
        <a href="{% url 'records:detail' medical_record.id %}">Back to medical record</a>
    </li>
    <li>
        <a href="{% url 'records:index' %}">All medical records</a>
    </li>
</ul>
