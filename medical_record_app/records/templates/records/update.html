{% extends "base.html" %}

{% block title %}
 Update medical record 
{% endblock %}

{% block content %}
<div class="mx-auto form-wrapper">
  <h1>Update Medical Record</h1>

  <form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <h2>Diagnoses</h2>

    {{ formset.management_form }}

    {% for f in formset %}
      <div>
        {{ f.as_p }}
      </div>
    {% endfor %}
    <a class="btn btn-secondary" href="{% url 'records:detail' medical_record.id %}">Cancel</a>
    <button class="btn btn-primary" type="submit">Update medical record</button>
  </form>

</div>
{% endblock %}
