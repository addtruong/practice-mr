<h1>Update Medical Record</h1>

<form method="post">
  {% csrf_token %}

  {{ form.as_p }}

  <h2>Diagnoses</h2>

  {{ formset.management_form }}

  {% for f in formset %}
    <div>
      {{ f.as_p }}
    </div>
  {% endfor %}

  <button type="submit">Update medical record</button>
</form>

<ul>
    <li>
        <a href="{% url 'records:detail' medical_record.id %}">Back to medical record</a>
    </li>
    <li>
        <a href="{% url 'records:index' %}">All medical records</a>
    </li>
</ul>
